[package]
name = "olcr-desktop"
version = "0.6.0"
edition = "2021"

[features]
default = []
opencv-perception = ["dep:opencv"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
keyring = { version = "3", features = ["apple-native"] }
libc = "0.2"
base64 = "0.22"
objc2 = { version = "=0.6.4", default-features = false }
opencv = { version = "=0.101.0", default-features = false, features = ["features", "imgproc", "video"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger"] }
axuielement = { version = "=0.10.0", features = ["async"] }
screencapturekit = { version = "=11.0.0", features = ["macos_14_0"] }
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSDictionary", "NSData", "NSString", "NSObject", "NSURL", "NSGeometry", "NSProcessInfo"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSRunningApplication", "NSWorkspace", "libc", "block2"] }
objc2-vision = { version = "=0.3.2", default-features = false, features = ["VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNObservation", "VNTypes", "VNTrackingRequest", "VNTrackObjectRequest", "objc2-core-foundation"] }
